version: '3.8'

services:
  bob-proxy:
    image: haproxy:2.9-alpine
    container_name: bob-proxy
    ports:
      - "8080:8080"   # WebSocket proxy
      - "8404:8404"   # Stats dashboard
      - "8405:8405"   # Tick status endpoint (debugging)
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./tick-checker.lua:/usr/local/etc/haproxy/tick-checker.lua:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "haproxy", "-c", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
      interval: 30s
      timeout: 10s
      retries: 3
