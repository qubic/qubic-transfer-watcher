global
    log stdout format raw local0
    maxconn 4096

    # Load Lua tick checker script
    lua-load /usr/local/etc/haproxy/tick-checker.lua

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 300s
    timeout server 300s
    timeout tunnel 3600s  # Long timeout for WebSocket connections

# Stats interface for monitoring
frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s
    stats admin if TRUE

# Tick status endpoint (for debugging)
frontend tick_status
    bind *:8405
    http-request use-service lua.tick_status

# Main WebSocket frontend
frontend ws_frontend
    bind *:8080

    # WebSocket detection
    acl is_websocket hdr(Upgrade) -i websocket

    # Route WebSocket traffic to backend
    use_backend ws_bob_backend if is_websocket

    # Default backend for non-WS (health checks, etc.)
    default_backend ws_bob_backend

# Bob WebSocket backend with tick-based health checking
backend ws_bob_backend
    balance roundrobin

    # WebSocket options
    option http-server-close
    option forwardfor

    # Extract tick from responses passing through (updates Lua state)
    http-response lua.extract_tick

    # Use Lua-based agent check for tick health
    # Agent returns UP/DOWN based on tick lag vs consensus
    default-server agent-check agent-port 9998 agent-inter 2s

    # Bob servers - adjust addresses as needed
    # inter: health check interval, fall: failures before down, rise: successes before up
    server bob1 bob1.qubic.li:443 check inter 3s fall 2 rise 2 ssl verify none
    server bob2 bob2.qubic.li:443 check inter 3s fall 2 rise 2 ssl verify none
    server bob3 bob3.qubic.li:443 check inter 3s fall 2 rise 2 ssl verify none

# Agent check listener (Lua tick_agent service)
frontend agent_check
    bind *:9998
    mode tcp
    default_backend agent_backend

backend agent_backend
    mode tcp
    tcp-request content use-service lua.tick_agent
